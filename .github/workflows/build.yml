name: Build Meshcore Gateway - Advanced v5 (Diagnostics + OTA)
on:
  workflow_dispatch:
    inputs:
      meshcore_version:
        description: 'latest or explicit version (e.g. 1.18.0)'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4
      - name: Test recipe structure and patches
        run: python3 -m unittest discover -s tests -v
      - name: Syntax check of Advanced C++ module with host interface stubs
        run: g++ -std=c++17 -fsyntax-only -Wall -Wextra -I tests/stubs -I overrides overrides/GatewayAdvanced.cpp
      - name: Compile diagnostics module on host
        run: g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -I overrides overrides/GatewayDiagnostics.cpp
      - name: Resolve official upstream repeater version
        id: upstream
        shell: bash
        run: bash scripts/resolve_version.sh '${{ inputs.meshcore_version }}'
      - name: Checkout official MeshCore sources
        uses: actions/checkout@v4
        with:
          repository: meshcore-dev/MeshCore
          ref: ${{ steps.upstream.outputs.tag }}
          path: firmware
          persist-credentials: false
      - name: Check supported source layout
        run: python3 scripts/check_compat.py firmware
      - name: Require explicit compatibility review of experimental patch
        shell: bash
        run: |
          if [[ '${{ steps.upstream.outputs.tag }}' != 'repeater-v1.18.0' ]]; then
            echo 'SPECIAL not reviewed for this upstream release. Select 1.18.0, or update patch after source review.' >&2
            exit 1
          fi
      - name: Apply experimental gateway/powersafe features
        run: python3 scripts/apply_special.py firmware
      - name: Instrument UART and radio decision points (no routing changes)
        run: python3 scripts/apply_diagnostics.py firmware
      - name: Validate the installed Advanced module
        shell: bash
        run: |
          set -euo pipefail
          test -s firmware/examples/simple_repeater/GatewayDiagnostics.cpp
          grep -Fq 'UART_RX_BAD_CRC' firmware/src/helpers/bridges/RS232Bridge.cpp
          grep -Fq 'UART_RX_DUP' firmware/src/helpers/bridges/BridgeBase.cpp
          grep -Fq 'LORA_TX_FAIL' firmware/examples/simple_repeater/MyMesh.cpp
          test -s firmware/examples/simple_repeater/GatewayAdvanced.cpp
          test -s firmware/examples/simple_repeater/GatewayAdvanced.h
          grep -Fq "GatewayAdvanced::handleCommand" firmware/src/helpers/CommonCLI.cpp
          grep -Fq "GatewayAdvanced::earlyResetCapture();" firmware/examples/simple_repeater/main.cpp
      - name: Install custom PlatformIO board environment
        shell: bash
        run: |
          set -euo pipefail
          cp platformio.local.ini firmware/platformio.local.ini
          grep -Fq '[env:Xiao_nrf52_repeater_rs232]' firmware/platformio.local.ini
      - name: Install Python / PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -d firmware -e Xiao_nrf52_repeater_rs232
      - name: Convert HEX to UF2
        shell: bash
        run: |
          set -euo pipefail
          DIR=firmware/.pio/build/Xiao_nrf52_repeater_rs232
          test -s "$DIR/firmware.hex"
          python firmware/bin/uf2conv/uf2conv.py "$DIR/firmware.hex" -c -o "$DIR/firmware.uf2" -f 0xADA52840
          test -s "$DIR/firmware.uf2"
      - name: Build application-only BLE DFU ZIP
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install adafruit-nrfutil
          DIR=firmware/.pio/build/Xiao_nrf52_repeater_rs232
          test -s "$DIR/firmware.hex"
          adafruit-nrfutil dfu genpkg --dev-type 0x0052 --application "$DIR/firmware.hex" "$DIR/firmware-dfu.zip"
          python3 - "$DIR/firmware-dfu.zip" <<'PYDFU'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('manifest.json'))['manifest']
              assert 'application' in manifest and 'bootloader' not in manifest and 'softdevice' not in manifest, manifest
              for k in ('bin_file','dat_file'):
                  assert manifest['application'][k] in z.namelist(), k
          print('Application-only DFU ZIP validated')
          PYDFU
      - name: Write build metadata
        shell: bash
        run: |
          set -euo pipefail
          DIR=firmware/.pio/build/Xiao_nrf52_repeater_rs232
          printf 'variant=Meshcore Gateway - Advanced v5\nupstream_tag=%s\nupstream_commit=%s\nfeatures=uart_diagnostics,remote_cli,application_dfu_zip\n' \
            '${{ steps.upstream.outputs.tag }}' "$(git -C firmware rev-parse HEAD)" > "$DIR/build_info.txt"
      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: Meshcore-Gateway-Advanced-${{ steps.upstream.outputs.tag }}
          path: |
            firmware/.pio/build/Xiao_nrf52_repeater_rs232/firmware-dfu.zip
            firmware/.pio/build/Xiao_nrf52_repeater_rs232/firmware.uf2
            firmware/.pio/build/Xiao_nrf52_repeater_rs232/firmware.bin
            firmware/.pio/build/Xiao_nrf52_repeater_rs232/build_info.txt
          if-no-files-found: error
          retention-days: 30
